[phases.setup]
# Ensure proper Node.js and basic utilities
nixPkgs = ["bash", "coreutils", "nodejs_20"]

[phases.install]
# Install required native libraries
aptPkgs = [
  "build-essential",
  "libcairo2-dev",
  "libpango1.0-dev",
  "libjpeg-dev",
  "libgif-dev",
  "librsvg2-dev"
]

cmds = [
  "npm install --omit=dev"
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = "npm start"