[phases.setup]
# Ensure core utilities are available
nixPkgs = ["bash", "coreutils"]

[phases.install]
# Install system libraries needed for node-canvas, sharp, etc.
aptPkgs = [
  "build-essential",
  "libcairo2-dev",
  "libpango1.0-dev",
  "libjpeg-dev",
  "libgif-dev",
  "librsvg2-dev"
]

# Install Node.js 20 (stable LTS)
[phases.build]
nixPkgs = ["nodejs_20"]

cmds = [
  "npm ci --omit=dev",
  "npm run build"
]

[start]
cmd = "npm start"