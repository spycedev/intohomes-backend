[phases.setup]
nixPkgs = ["bash", "coreutils", "nodejs_20"]

[phases.install]
# Required native libs for node-canvas, sharp, etc.
aptPkgs = [
  "build-essential",
  "libcairo2-dev",
  "libpango1.0-dev",
  "libjpeg-dev",
  "libgif-dev",
  "librsvg2-dev"
]

cmds = [
  "npm ci --omit=dev"
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = "npm start"